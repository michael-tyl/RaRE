# Medicine (RaR-Medicine -> HealthBench).
# LoRA vs. full-FT (appendix): DeepSeek-V3.1 single judge with LoRA.
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_4o_ds_lora.yaml --train-gpus 8
run_name: jvr_4o_ds_lora
domain: medicine
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_model: '@togetherai/deepseek-ai/DeepSeek-V3.1'
judge_url: https://api.portkey.ai/v1
judge_api_key_env: PORTKEY_API_KEY
judge_max_concurrent: 16

num_generations: 8
per_device_train_batch_size: 8

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_steps: 100
save_steps: 50
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

lora: true
lora_args:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

report_to: wandb
