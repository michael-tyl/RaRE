# Medicine (RaR-Medicine -> HealthBench).
# Retro-GRPO-aux (appendix): Gemini + DeepSeek, k = 50; LoRA.
#
# sbatch --export=ALL scripts/slurm/run_likert_retro.sbatch \
#     --config configs/run_jvr_4o_gemds_likert_retro_k50_lora.yaml --train-gpus 8
run_name: jvr_4o_gemds_likert_retro_k50_lora
domain: medicine
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_api_key_env: PORTKEY_API_KEY

judges:
  - tag: gem
    model: '@google/gemini-2.5-flash-lite'
    url: https://api.portkey.ai/v1
    max_concurrent: 8
    max_tokens: 32
  - tag: ds
    model: '@togetherai/deepseek-ai/DeepSeek-V3.1'
    url: https://api.portkey.ai/v1
    max_concurrent: 8
    max_tokens: 32

disagreement_threshold: 0.30
soft_likert_args:
  top_logprobs: 5
  scale_max: 10

retro_k: 50
retro_lambda: 0.5
retro_clip_ratio: 0.2
smooth_retro_label: true
n_flush_steps: 5
flush_min_drift: 25

num_generations: 8
per_device_train_batch_size: 8

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_prompt_length: 1024
max_steps: 100
save_steps: 50
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

lora: true
lora_args:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

report_to: wandb
