# Medicine (RaR-Medicine -> HealthBench).
# Gem+DS tau sweep (HealthBench 1K subset): mean + drop, tau = 0.25.
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_4o_gemds_drop025.yaml --train-gpus 8
run_name: jvr_4o_gemds_drop025
domain: medicine
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_api_key_env: PORTKEY_API_KEY

judges:
  - tag: gem
    model: '@google/gemini-2.5-flash-lite'
    url: https://api.portkey.ai/v1
    max_concurrent: 8
    max_tokens: 128
  - tag: ds
    model: '@togetherai/deepseek-ai/DeepSeek-V3.1'
    url: https://api.portkey.ai/v1
    max_concurrent: 8
    max_tokens: 128

disagreement_threshold: 0.25

num_generations: 8
per_device_train_batch_size: 8

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_steps: 100
save_steps: 50
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

report_to: wandb
