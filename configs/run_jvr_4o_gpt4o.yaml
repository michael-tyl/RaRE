# Medicine (RaR-Medicine -> HealthBench).
# Training-cost comparison (appendix): single-judge RaR with GPT-4o (hard Likert 1-10).
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_4o_gpt4o.yaml --train-gpus 8
run_name: jvr_4o_gpt4o
domain: medicine
policy_model: Qwen/Qwen3-4B-Base
n_train: 1000
seed: 0
rubric_path: null
judge_model: gpt-4o
judge_url: https://api.openai.com/v1
judge_api_key_env: OPENAI_API_KEY
judge_max_concurrent: 16
num_generations: 8
per_device_train_batch_size: 8
learning_rate: 5.0e-06
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0
max_completion_length: 1024
max_steps: 100
save_steps: 100
beta: 0.0
scale_rewards: false
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304
gradient_checkpointing: true
optim: adamw_bnb_8bit
report_to: wandb
reward_type: absolute
judge_max_tokens: 128
strict_scores: true
