# Science (RaR-Science -> GPQA Diamond); run with --seed 0..4.
# Single-judge RaR: gpt-oss-120b, low reasoning effort (hard Likert 1-10).
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_sci_oss.yaml --train-gpus 8 --seed N
run_name: jvr_sci_oss
domain: science
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_model: '@togetherai/openai/gpt-oss-120b'
judge_url: https://api.portkey.ai/v1
judge_api_key_env: PORTKEY_API_KEY
judge_max_concurrent: 16
judge_max_tokens: 512        # room for ~280 reasoning + JSON output
judge_reasoning_effort: low

num_generations: 8
per_device_train_batch_size: 4

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 2048
max_steps: 100
save_steps: 100
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 3328

gradient_checkpointing: true
optim: adamw_bnb_8bit

report_to: wandb
