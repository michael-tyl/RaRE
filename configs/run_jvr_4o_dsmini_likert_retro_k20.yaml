# Medicine (RaR-Medicine -> HealthBench).
# Retro-GRPO-aux (appendix): DS+Mini, k = 20; LoRA.
#
# sbatch --export=ALL scripts/slurm/run_likert_retro.sbatch \
#     --config configs/run_jvr_4o_dsmini_likert_retro_k20.yaml --train-gpus 8
run_name: jvr_4o_dsmini_likert_retro_k20
domain: medicine
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_api_key_env: OPENAI_API_KEY

judges:
  - tag: ds
    model: deepseek-ai/DeepSeek-V3.1
    url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    max_concurrent: 8
    max_tokens: 32
  - tag: mini
    model: gpt-4o-mini
    url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_concurrent: 8
    max_tokens: 32

disagreement_threshold: 0.30
soft_likert_args:
  top_logprobs: 5

retro_k: 20
retro_lambda: 0.5
retro_clip_ratio: 0.2
smooth_retro_label: true
n_flush_steps: 10
flush_min_drift: 10

num_generations: 8
per_device_train_batch_size: 8

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_prompt_length: 1024
max_steps: 100
save_steps: 50
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

lora: true
lora_args:
  r: 32
  alpha: 64
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

report_to: wandb
