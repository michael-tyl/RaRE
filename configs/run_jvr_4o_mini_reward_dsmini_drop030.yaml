# Medicine (RaR-Medicine -> HealthBench).
# Single-judge reward with two-judge drop (appendix): gpt-4o-mini alone supplies
# the reward; gpt-4o-mini and DeepSeek-V3.1 both rate every rollout (integer
# 1-5 ratings) to compute the drop mask, tau = 0.30.
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_4o_mini_reward_dsmini_drop030.yaml --train-gpus 8
run_name: jvr_4o_mini_reward_dsmini_drop030
domain: medicine
policy_model: Qwen/Qwen3-4B-Base
n_train: 1000
seed: 0
rubric_path: null
judge_api_key_env: OPENROUTER_API_KEY
judges:
- tag: ds
  model: deepseek/deepseek-chat-v3.1
  url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  max_concurrent: 8
  max_tokens: 32
  temperature: 0.0
  response_format: json_schema
  extra_body:
    reasoning:
      enabled: false
    provider:
      only:
      - coreweave/fp8
      allow_fallbacks: false
      require_parameters: true
- tag: mini
  model: openai/gpt-4o-mini
  url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
  max_concurrent: 8
  max_tokens: 32
  temperature: 0.0
  extra_body:
    provider:
      only:
      - openai
      allow_fallbacks: false
      require_parameters: true
reward_type: ensemble_soft_likert_drop
disagreement_threshold: 0.3
soft_likert_args:
  top_logprobs: 5
  scale_max: 5
  confidence_mode: inverse_var
  aggregation: weighted_avg
  normalize_disagreement: false
  strict_scores: true
  reward_judge_tag: mini
  rating_mode: hard
  disagreement_rating_mode: hard
num_generations: 8
per_device_train_batch_size: 8
learning_rate: 5.0e-06
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0
max_completion_length: 1024
max_steps: 100
save_steps: 100
beta: 0.0
scale_rewards: false
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304
gradient_checkpointing: true
optim: adamw_bnb_8bit
report_to: wandb
