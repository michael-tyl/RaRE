# Medicine (RaR-Medicine -> HealthBench).
# Soft-Likert scale ablation (appendix): DeepSeek + gpt-4o-mini soft-Likert,
# no drop, L = 7 (compare run_jvr_4o_dsmini_softlikert, L = 5). HealthBench 1K subset.
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_4o_dsmini_softlikert7.yaml --train-gpus 8
run_name: jvr_4o_dsmini_softlikert7
domain: medicine
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

reward_type: ensemble_soft_likert
judge_api_key_env: OPENAI_API_KEY

judges:
  - tag: ds
    model: deepseek-ai/DeepSeek-V3.1
    url: https://api.together.xyz/v1
    api_key_env: TOGETHER_API_KEY
    max_concurrent: 8
    max_tokens: 32
  - tag: mini
    model: gpt-4o-mini
    url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_concurrent: 8
    max_tokens: 32

soft_likert_args:
  top_logprobs: 10
  scale_max: 7

num_generations: 8
per_device_train_batch_size: 8

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_prompt_length: 1024
max_steps: 100
save_steps: 50
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

report_to: wandb
