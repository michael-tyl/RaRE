# Science (RaR-Science -> GPQA Diamond); run with --seed 0..4.
# Single-judge RaR: DeepSeek-V3.1 (hard Likert 1-10).
#
# sbatch --export=ALL scripts/slurm/run_one_remote_judge.sbatch \
#     --config configs/run_jvr_sci_ds.yaml --train-gpus 8 --seed N
run_name: jvr_sci_ds
domain: science
policy_model: Qwen/Qwen3-4B-Base

n_train: 1000
seed: 0
rubric_path: null

judge_model: deepseek-ai/DeepSeek-V3.1
judge_url: https://api.deepinfra.com/v1/openai
judge_api_key_env: DEEPINFRA_API_KEY
judge_max_concurrent: 16

num_generations: 8
per_device_train_batch_size: 4

learning_rate: 5.0e-6
warmup_ratio: 0.1
lr_scheduler_type: constant_with_warmup
temperature: 1.0

max_completion_length: 1024
max_steps: 100
save_steps: 100
beta: 0.0
scale_rewards: false

use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.12
vllm_max_model_length: 2304

gradient_checkpointing: true
optim: adamw_bnb_8bit

report_to: wandb
