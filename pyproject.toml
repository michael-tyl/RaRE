[project]
name = "rar"
version = "0.0.1"
description = "RaRE: Rubrics as Rewards with judge ensembles (GRPO on Qwen3)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "trl[vllm]==1.0.0",
    "vllm==0.16.0",
    "transformers>=4.55.0",
    "accelerate>=1.0.0",
    "datasets>=3.0.0",
    "peft>=0.13.0",
    "openai>=1.50.0",
    "wandb>=0.18.0",
    "pyyaml>=6.0",
    "numpy",
    "httpx",
    "huggingface_hub",
    "langdetect>=1.0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rar"]
